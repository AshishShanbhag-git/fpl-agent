# Scheduled job: every 6 hours, snapshot the FPL API into the landing Volume, refresh bronze + silver + gold,
# then score xPts (skipped when nothing changed).
# No cluster is configured, so it runs on serverless compute (the only option on Free Edition).
resources:
  jobs:
    fpl_ingest:
      name: fpl-ingest
      description: Snapshot FPL API endpoints into /Volumes/${var.catalog}/raw/landing every 6 hours

      schedule:
        quartz_cron_expression: "0 15 0/6 * * ?"   # 00:15, 06:15, 12:15, 18:15
        timezone_id: Europe/London
        pause_status: UNPAUSED

      max_concurrent_runs: 1
      timeout_seconds: 1800

      tasks:
        - task_key: fetch_fpl_api
          notebook_task:
            notebook_path: ../src/ingest/fetch_fpl.py
            base_parameters:
              catalog: ${var.catalog}
          max_retries: 2
          min_retry_interval_millis: 300000          # wait 5 min before retrying

        # Per-player match history (~700 requests). Fetches on the first run of each UTC day, skips otherwise.
        - task_key: fetch_element_summaries
          depends_on:
            - task_key: fetch_fpl_api
          notebook_task:
            notebook_path: ../src/ingest/fetch_element_summaries.py
            base_parameters:
              catalog: ${var.catalog}
          max_retries: 1
          min_retry_interval_millis: 600000

        # New FPL tip articles from approved sources (config/tip_sources.yml). Independent of the FPL fetches.
        - task_key: fetch_tips
          notebook_task:
            notebook_path: ../src/tips/fetch_tips.py
            base_parameters:
              catalog: ${var.catalog}
              bundle_root: ${workspace.file_path}
              mode: incremental
          max_retries: 1
          min_retry_interval_millis: 600000

        # Loads all new files into bronze, then refreshes silver. ALL_DONE: a failed tips fetch
        # must not stop the FPL data from being processed.
        - task_key: transform
          run_if: ALL_DONE
          depends_on:
            - task_key: fetch_element_summaries
            - task_key: fetch_tips
          pipeline_task:
            pipeline_id: ${resources.pipelines.fpl_bronze.id}
            full_refresh: false

        # xPts for the next 5 gameweeks -> gold.xpts. Exits in seconds when its inputs haven't changed
        # (most runs: the features only move when a gameweek finishes).
        - task_key: score_xpts
          depends_on:
            - task_key: transform
          notebook_task:
            notebook_path: ../src/ml/score_xpts.py
            base_parameters:
              catalog: ${var.catalog}
              force: "false"
          max_retries: 1
          min_retry_interval_millis: 300000
