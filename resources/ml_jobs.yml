# Manual ML jobs (not scheduled). Run with:  databricks bundle run fpl_xpts_eval
resources:
  jobs:
    fpl_xpts_eval:
      name: fpl-xpts-eval
      max_concurrent_runs: 1
      tasks:
        - task_key: evaluate_baselines
          notebook_task:
            notebook_path: ../src/ml/evaluate_baselines.py
            base_parameters:
              catalog: ${var.catalog}
              bundle_root: ${workspace.file_path}
          timeout_seconds: 3600

    fpl_xpts_train:
      name: fpl-xpts-train
      max_concurrent_runs: 1
      tasks:
        - task_key: train_lgbm
          notebook_task:
            notebook_path: ../src/ml/train_xpts.py
            base_parameters:
              catalog: ${var.catalog}
              bundle_root: ${workspace.file_path}
              experiment_id: ${resources.experiments.xpts_experiment.id}
          timeout_seconds: 5400
