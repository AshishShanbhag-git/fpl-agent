# Unity Catalog layout (medallion architecture).
# raw    -> untouched API files exactly as downloaded (the Volume below)
# bronze -> raw JSON loaded into tables
# silver -> cleaned, typed tables (players, teams, fixtures, news snapshots, ...)
# gold   -> model-ready features, xPts predictions, recommendations
# ml     -> registered models
#
# prevent_destroy: these hold irreplaceable history (FPL only shows *today's* news/prices),
# so `bundle destroy` must never delete them.
resources:
  schemas:
    raw:
      catalog_name: ${var.catalog}
      name: raw
      comment: Untouched FPL API snapshots
      lifecycle:
        prevent_destroy: true
    bronze:
      catalog_name: ${var.catalog}
      name: bronze
      comment: Raw JSON loaded into Delta tables
      lifecycle:
        prevent_destroy: true
    silver:
      catalog_name: ${var.catalog}
      name: silver
      comment: Cleaned, typed entity tables
    gold:
      catalog_name: ${var.catalog}
      name: gold
      comment: Features, xPts and recommendations
    ml:
      catalog_name: ${var.catalog}
      name: ml
      comment: Registered ML models

  volumes:
    landing:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.raw.name}
      name: landing
      volume_type: MANAGED
      comment: Timestamped JSON files downloaded from the FPL API
      lifecycle:
        prevent_destroy: true

    # PRIVATE: full text of third-party tip articles, kept only as LLM-extraction input.
    # Never grant access to others; silver/gold store structured tip facts + URL only.
    tips_landing:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.raw.name}
      name: tips_landing
      volume_type: MANAGED
      comment: PRIVATE - fetched FPL tip articles (raw text) from approved sources; LLM-extraction input only
      lifecycle:
        prevent_destroy: true
